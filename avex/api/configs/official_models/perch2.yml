---
# Google Perch v2 bird-vocalization classifier (third-party, Apache-2.0):
# EfficientNet-B3 + ProtoPNet head, 14 795 classes, 1536-d embeddings.
# https://www.kaggle.com/models/google/bird-vocalization-classifier
#
# Not an ESP model and not redistributed: avex runs a hand-written PyTorch
# port (avex/models/perch2_net/). On first use it downloads the pinned ONNX
# export (justinchuby/Perch-onnx, sha256-verified), converts it and caches
# the weights; `avex fetch perch2` does this ahead of time. No
# checkpoint_path, so load_model() runs in embedding-extraction mode.
# Input: 32 kHz mono, cropped or padded to 5 s.

model_spec:
  name: perch2
  pretrained: true
  device: cpu
  audio_config:
    sample_rate: 32000
    target_length_seconds: 5
