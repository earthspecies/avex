---
# Upstream BEATs iter3+ backbone, self-supervised pre-trained on AudioSet-2M and
# then fine-tuned on AudioSet-2M (527 classes), checkpoint "cpt2"
# (Microsoft, https://github.com/microsoft/unilm/tree/master/beats). This is
# the starting point for the ESP-AVES2 `esp_aves2_sl_beats_*` models.
#
# Bring your own checkpoint: the weights are not bundled or mirrored on the
# Hugging Face Hub, so `checkpoint_path` must be passed to `load_model`:
#
#     load_model("beats_iter3_plus_as2m_finetuned_cpt2",
#                checkpoint_path="/path/to/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt")
#
# The loader accepts the upstream `.pt` release as-is (a dict with `cfg` and
# `model` keys). ESP-internal source of truth for the file is recorded in
# avex/api/configs/checkpoints/beats_iter3_plus_as2m_finetuned_cpt2.yml (a
# gs:// URI that also works as `checkpoint_path` with GCS credentials).
#
# The upstream AudioSet predictor head (`predictor`, 768 -> 527) is loaded into
# the backbone but is not exposed as an avex classifier: the model always loads
# in embedding-extraction mode and returns frame-level features. No
# class_mapping_path is provided.

model_spec:
  name: beats
  pretrained: false
  fine_tuned: true
  device: cuda
  init_config:
    activation_dropout: 0.0
    activation_fn: gelu
    attention_dropout: 0.0
    conv_bias: false
    conv_pos: 128
    conv_pos_groups: 16
    deep_norm: true
    dropout: 0.0
    dropout_input: 0.0
    embed_dim: 512
    encoder_attention_heads: 12
    encoder_embed_dim: 768
    encoder_ffn_embed_dim: 3072
    encoder_layerdrop: 0.05
    encoder_layers: 12
    finetuned_model: true
    gru_rel_pos: true
    input_patch_size: 16
    layer_norm_first: false
    layer_wise_gradient_decay_ratio: 0.6
    max_distance: 800
    num_buckets: 320
    predictor_class: 527
    predictor_dropout: 0.0
    relative_position_embedding: true
    sample_frequency: 16000.0
    num_mel_bins: 128
    frame_length: 25.0
    frame_shift: 10.0
    fbank_mean: 15.41663
    fbank_std: 6.55582
  audio_config:
    sample_rate: 16000
    representation: raw
    normalize: false
    target_length_seconds: 10
    window_selection: random
