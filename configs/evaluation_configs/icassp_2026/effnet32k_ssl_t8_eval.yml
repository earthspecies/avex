# EfficientNet-B0 32 kHz (Marius effnet_32khz_v0), AVEX Table 8.
# Generated from xenomae_xc1m_t8_eval.yml: only run_config, checkpoint_path, target_layers
# (model.features.8.0 = final 1280-ch conv; 'last_layer' would hit the unused ImageNet head)
# and names differ.
dataset_config: configs/data_configs/benchmark_birdset_gcs_32k.yml

training_params:
  train_epochs: 900
  lr: 0.0001
  batch_size: 32
  optimizer: adamw
  weight_decay: 0.1
  amp: false

experiments:
  - run_name: effnet32k_ssl_t8
    run_config: configs/run_configs/icassp_2026/effnet_32khz_v0.yml
    pretrained: false
    checkpoint_path: gs://representation-learning/models/v1/effnet_32khz_v0/final_model.pt
    probe_config:
      probe_type: linear
      target_layers: ["model.features.8.0"]
      aggregation: "mean"
      input_processing: "pooled"
      freeze_backbone: true
      online_training: false

save_dir: evaluation_results/icassp2026_effnet32k_ssl_t8
results_csv_path: evaluation_results/icassp2026_effnet32k_ssl_t8/results.csv
device: cuda
seed: 42
num_workers: 16
eval_modes:
  - probe
  - retrieval
offline_embeddings:
  overwrite_embeddings: true
  probe_storage_aggregation: mean   # store (N, 768); see eat_*_probe_attnproj.yml
disable_tqdm: true
