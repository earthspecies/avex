# Linear probing of PupuJEPA-Base SSL, to produce the Probe column of AVEX Table 6.
#
# Hyperparameters are the PAPER's probing spec, not the committed icassp configs:
#   "a learning rate of 1e-4, weight decay of 0.1, batch size of 32, and 900 epochs"
# (the older configs/evaluation_configs/icassp/*.yml say 50 epochs / lr 1e-3 /
# wd 0.01, which does not match the published protocol).
#
# Protocol, per paper S3.4: "linear probing on time-averaged embeddings ...
# extracted from the final layer (excluding classification heads)". PupuJEPA's
# wrapper already returns its native pooled final-layer embedding as (B, 1, 768),
# so aggregation: mean over the length-1 axis is a no-op.
dataset_config: configs/data_configs/benchmark_beans_gcs_classification.yml

training_params:
  train_epochs: 900
  lr: 0.0001
  batch_size: 32
  optimizer: adamw
  weight_decay: 0.1
  amp: false

experiments:
  - run_name: eat_ssl_all_linear_last
    run_config: configs/run_configs/icassp_2026/eat_ssl_all.yml
    pretrained: false
    checkpoint_path: hf://EarthSpeciesProject/esp-aves2-eat-all/esp-aves2-eat-all.safetensors
    probe_config:
      probe_type: linear
      target_layers: ["backbone.model.blocks.11.mlp.fc2"]
      aggregation: "mean"
      input_processing: "pooled"
      freeze_backbone: true
      online_training: false

save_dir: evaluation_results/icassp2026_eat_ssl_all_probe
results_csv_path: evaluation_results/icassp2026_eat_ssl_all_probe/results.csv
device: cuda
seed: 42
num_workers: 8
eval_modes:
  - probe
offline_embeddings:
  overwrite_embeddings: true
disable_tqdm: true
