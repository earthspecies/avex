# XC_1M MAE (xenomae_avexall), AVEX Table 6. Generated from pupujepa_bigrun_final_eval.yml: only run_config,
# run_name, save_dir, results_csv_path differ.
# Probe + retrieval + clustering in one pass, pooled storage. Generated from pupujepa_bigrun_probe.yml.
# Linear probing of PupuJEPA-Base SSL, to produce the Probe column of AVEX Table 6.
#
# Hyperparameters are the PAPER's probing spec, not the committed icassp configs:
#   "a learning rate of 1e-4, weight decay of 0.1, batch size of 32, and 900 epochs"
# (the older configs/evaluation_configs/icassp/*.yml say 50 epochs / lr 1e-3 /
# wd 0.01, which does not match the published protocol).
#
# Protocol, per paper S3.4: "linear probing on time-averaged embeddings ...
# extracted from the final layer (excluding classification heads)". PupuJEPA's
# wrapper already returns its native pooled final-layer embedding as (B, 1, 768),
# so aggregation: mean over the length-1 axis is a no-op.
dataset_config: configs/data_configs/benchmark_beans_gcs_32k_classification.yml

training_params:
  train_epochs: 900
  lr: 0.0001
  batch_size: 32
  optimizer: adamw
  weight_decay: 0.1
  amp: false

experiments:
  - run_name: xenomae_avexall_t6
    run_config: configs/run_configs/icassp_2026/xenomae_avexall.yml
    pretrained: true
    probe_config:
      probe_type: linear
      target_layers: ["output_features"]
      aggregation: "mean"
      input_processing: "pooled"
      freeze_backbone: true
      online_training: false

save_dir: evaluation_results/icassp2026_xenomae_avexall_t6
results_csv_path: evaluation_results/icassp2026_xenomae_avexall_t6/results.csv
device: cuda
seed: 42
num_workers: 8
eval_modes:
  - probe
  - retrieval
  - clustering
offline_embeddings:
  overwrite_embeddings: true
  probe_storage_aggregation: mean   # store (N, 768); see eat_*_probe_attnproj.yml
disable_tqdm: true
