---
# SSL EAT trained on all (AudioSet + bioacoustics) — the published esp_aves2_eat_all.
# Weights via hf:// (checkpoint_path set in the eval experiment).
model_spec:
  name: eat_hf
  pretrained: false
  device: cuda
  eat_norm_mean: -5.553
  eat_norm_std: 4.606
  audio_config:
    sample_rate: 16000
    representation: raw
    normalize: false
    target_length_seconds: 10
    window_selection: random

dataset_config: configs/data_configs/data_base.yml
run_name: eat_ssl_all
output_dir: "./runs/icassp2026/eat_ssl_all"
loss_function: cross_entropy
label_type: supervised
preprocessing: null
sr: 16000
debug_mode: false
logging: mlflow
resume_from_checkpoint: null
training_params:
  train_epochs: 1
  lr: 0.001
  batch_size: 32
  optimizer: adamw
  weight_decay: 0.01
  amp: false
seed: 42
num_workers: 8
augmentations: []
